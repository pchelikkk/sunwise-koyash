stages:
  - test
  - deploy

backend-tests:
  stage: test
  image: python:3.12-slim

  services:
    - name: mongo:7
      alias: mongo
      command: ["--quiet"]

  variables:
    APP_NAME: "KOYASH API"
    APP_ENV: "test"
    API_V1_PREFIX: "/api/v1"

    MONGO_INITDB_ROOT_USERNAME: "koyash"
    MONGO_INITDB_ROOT_PASSWORD: "koyash_dev_password"
    MONGO_INITDB_DATABASE: "koyash_test"

    MONGO_URI: "mongodb://koyash:koyash_dev_password@mongo:27017/?authSource=admin"
    MONGO_DB_NAME: "koyash_test"

    CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"
    JWT_SECRET_KEY: "test_secret_key"
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ANALYTICS_RAW_EVENT_TTL_DAYS: "30"

    LLM_ENABLED: "false"
    VSELLM_BASE_URL: "https://api.vsellm.ru/v1"
    VSELLM_MODEL: "openai/gpt-4o-mini"
    VSELLM_API_KEY: ""

    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

  cache:
    paths:
      - .cache/pip

  before_script:
    - cd backend
    - python --version
    - python -m pip --version
    - python -m pip install --no-cache-dir -r requirements.txt

  script:
    - python -m ruff check app tests
    - pytest -q

frontend-quality:
  stage: test
  image: node:24-bookworm-slim

  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/.npm/

  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

  script:
    - npm audit --audit-level=high
    - npm test
    - npm run build

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/dist/

frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.61.1-noble

  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/.npm/

  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline

  script:
    - npm run test:e2e

  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - frontend/test-results/

create-pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - backend-tests
    - frontend-quality
    - frontend-e2e
  script:
    - mkdir -p public
    - cp -R docs-site/. public/
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
